<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #333;
            max-width: 500px;
            width: 90%;
        }
        .key-display {
            background: #0a0a0a;
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            font-size: 24px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            min-height: 70px;
        }
        .btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { transform: scale(1.05); }
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #444;
            font-size: 12px;
            text-decoration: none;
        }
        .admin-link:hover { color: #00ff88; }
    </style>
</head>
<body>
    <!-- Link Admin trỏ sang Vercel -->
    <a href="https://admin-cua-may.vercel.app" class="admin-link">⚙️ Admin</a>

    <div class="container">
        <h1 style="color: #fff;">🔑 KEY TOOL</h1>
        <div class="key-display" id="keyDisplay">Loading...</div>
        <button class="btn" onclick="copyKey()">📋 Copy Key</button>
    </div>

    <script>
        // === Lấy key từ URL ===
        function getKeyFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('key');
        }

        // === Lấy key từ localStorage (dùng chung) ===
        function getKeyFromStorage() {
            try {
                return localStorage.getItem('currentKey');
            } catch { return null; }
        }

        function getKey() {
            return getKeyFromURL() || getKeyFromStorage() || 'KEYREDEEEM-DEFAULT';
        }

        function displayKey() {
            const key = getKey();
            document.getElementById('keyDisplay').textContent = key;
            // Lưu vào localStorage để dùng chung với Admin
            localStorage.setItem('currentKey', key);
        }

        function copyKey() {
            const key = document.getElementById('keyDisplay').textContent;
            navigator.clipboard.writeText(key)
                .then(() => alert('✅ Đã copy: ' + key))
                .catch(() => alert('❌ Copy thất bại'));
        }

        displayKey();
        console.log('🔑 Key:', getKey());
    </script>
</body>
</html>
