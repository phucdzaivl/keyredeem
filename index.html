<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-image: url('https://raw.githubusercontent.com/KingNotNgu/kingweb/main/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .container h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .container h1 span {
            color: #00ff88;
        }

        .sub-title {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .key-display {
            background: rgba(0, 255, 136, 0.08);
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 18px 20px;
            margin: 20px 0 25px;
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            letter-spacing: 2px;
            word-break: break-all;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .key-display.loading {
            color: #888;
            border-color: #555;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .key-display.error {
            color: #ff4444;
            border-color: #ff4444;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-copy {
            background: #00ff88;
            color: #000;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }

        .btn-copy:active {
            transform: scale(0.95);
        }

        .footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #666;
            font-size: 13px;
        }

        .footer a {
            color: #00ff88;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer a:hover {
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            text-decoration: none;
            transition: 0.3s;
        }

        .admin-link:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.1);
        }

        .toast.error {
            border-color: #ff4444;
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.1);
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            .container h1 {
                font-size: 22px;
            }
            .key-display {
                font-size: 18px;
                padding: 14px;
                min-height: 60px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="toast" id="toast"></div>

    <a href="#" class="admin-link" onclick="goToAdmin(); return false;">⚙️ Admin</a>

    <div class="container">
        <h1>🔑 <span>KEY</span> TOOL</h1>
        <p class="sub-title">⚡ Key của bạn được tạo tự động</p>

        <div class="key-display loading" id="keyDisplay">⌛ Đang tải key...</div>

        <button class="btn btn-copy" onclick="copyKey()">
            📋 Copy Key
        </button>

        <div class="footer">
            <p>📱 Telegram: <a href="https://t.me/kingdevzz" target="_blank">@kingdevzz</a></p>
            <p style="margin-top: 5px; font-size: 11px; color: #444;">
                🔐 Key được bảo vệ bằng mã hóa
            </p>
        </div>
    </div>

    <script>
        // =============================================
        // 1. ANIMATION PARTICLES
        // =============================================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        const particles = [];
        const PARTICLE_COUNT = 100;
        const CONNECTION_DIST = 120;
        let mouse = { x: null, y: null };

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1.5;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECTION_DIST) {
                        const opacity = 1 - (dist / CONNECTION_DIST);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.3})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
                if (mouse.x !== null) {
                    const dx = particles[i].x - mouse.x;
                    const dy = particles[i].y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECTION_DIST) {
                        const opacity = 1 - (dist / CONNECTION_DIST);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.strokeStyle = `rgba(0, 255, 136, ${opacity * 0.2})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (const p of particles) {
                p.update();
                p.draw();
            }
            drawConnections();
            requestAnimationFrame(animateParticles);
        }

        // =============================================
        // 2. KEY SYSTEM
        // =============================================

        // Lấy danh sách key từ localStorage (do Admin tạo)
        function getKeyList() {
            try {
                const data = localStorage.getItem('keyList');
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        // Lưu danh sách key
        function saveKeyList(keys) {
            localStorage.setItem('keyList', JSON.stringify(keys));
        }

        // Kiểm tra key có hợp lệ không
        function isValidKey(key) {
            const keys = getKeyList();
            return keys.includes(key);
        }

        // Lấy key từ URL
        function getKeyFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('key');
        }

        // Key mặc định (dự phòng)
        function getDefaultKey() {
            const encoded = 'S0lORy0yMDI0LVNFQ1JFVA==';
            try {
                return atob(encoded);
            } catch {
                return 'KEYREDEEEM-DEFAULT';
            }
        }

        // Hàm lấy key chính
        function getKey() {
            const urlKey = getKeyFromURL();
            if (urlKey && isValidKey(urlKey)) {
                return urlKey;
            }
            // Nếu key trên URL không hợp lệ, thử lấy key đã lưu trong session
            const sessionKey = sessionStorage.getItem('currentKey');
            if (sessionKey && isValidKey(sessionKey)) {
                return sessionKey;
            }
            return getDefaultKey();
        }

        // =============================================
        // 3. UI CONTROLS
        // =============================================

        const keyDisplay = document.getElementById('keyDisplay');
        const toast = document.getElementById('toast');
        let toastTimeout = null;

        function displayKey() {
            const key = getKey();
            const isValid = isValidKey(key);
            
            if (isValid) {
                keyDisplay.textContent = key;
                keyDisplay.classList.remove('loading', 'error');
                // Lưu key vào session
                sessionStorage.setItem('currentKey', key);
            } else {
                keyDisplay.textContent = '❌ Key không hợp lệ hoặc đã hết hạn!';
                keyDisplay.classList.remove('loading');
                keyDisplay.classList.add('error');
            }
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function copyKey() {
            const key = keyDisplay.textContent;
            if (!key || key.includes('Không') || key.includes('lỗi') || key.includes('không hợp lệ')) {
                showToast('❌ Không có key hợp lệ để copy!', 'error');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(key)
                    .then(() => showToast('✅ Đã copy: ' + key, 'success'))
                    .catch(() => fallbackCopy(key));
            } else {
                fallbackCopy(key);
            }
        }

        function fallbackCopy(text) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Đã copy: ' + text, 'success');
            } catch {
                showToast('❌ Copy thất bại, vui lòng copy thủ công', 'error');
            }
        }

        // =============================================
        // 4. RESIZE & MOUSE
        // =============================================

        function handleResize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // =============================================
        // 5. INIT
        // =============================================

        function init() {
            // Nếu chưa có key mặc định trong danh sách, thêm vào
            const keys = getKeyList();
            if (keys.length === 0) {
                saveKeyList(['KEYREDEEEM-DEFAULT', 'KEYREDEEEM-ADMIN']);
            }

            initParticles();
            animateParticles();
            displayKey();
            window.addEventListener('resize', handleResize);

            console.log('🚀 King Tool loaded!');
            console.log('🔑 Key hiện tại:', getKey());
            console.log('📋 Danh sách key:', getKeyList());
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

</body>
</html>
